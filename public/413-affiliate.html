<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File Terlalu Besar | Kampus Media</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font-family: Arial, sans-serif; }
        main { width: min(92vw, 560px); background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px; box-shadow: 0 24px 70px rgba(15, 23, 42, .12); }
        .badge { display: inline-block; padding: 8px 12px; border-radius: 999px; background: #fee2e2; color: #991b1b; font-weight: 800; font-size: 13px; }
        h1 { margin: 18px 0 10px; font-size: 30px; line-height: 1.15; color: #071a3d; }
        p { margin: 0; color: #475569; line-height: 1.7; font-weight: 600; }
        a { display: inline-block; margin-top: 22px; padding: 14px 20px; border-radius: 999px; background: #0f766e; color: white; text-decoration: none; font-weight: 800; }
    </style>
</head>
<body>
    <main>
        <span class="badge">Upload gagal</span>
        <h1>File KTP terlalu besar.</h1>
        <p>Ukuran file yang diunggah melebihi batas. Mohon kompres atau ganti file KTP dengan ukuran maksimal 4 MB, lalu kirim ulang pendaftaran.</p>
        <a href="/daftar">Kembali ke Form Affiliate</a>
    </main>
